openapi: 3.1.0
info:
  title: Matriz API
  version: 1.0.0
  summary: Contrato REST do MVP da Matriz.
  description: |
    Ficha Prática 02, Exercício 3; completado na Ficha Prática 03, Exercício 1.
    Proposta, por aprovar pela dona do produto (R-06).

    Cobre todas as operações do MVP (RF-01 a RF-18, RF-22, RF-24, RF-30, RF-32 a RF-35).

    Contexto:
    - Arquitetura em `docs/architecture.md`; modelo de dados em `docs/database.md`;
      plano de implementação em `docs/implementation-plan.md`.
    - Autenticação por sessão (Q-22): `POST /sessao` devolve o cookie httpOnly `matriz_sessao`.
      Todas as outras operações, exceto `GET /saude`, exigem esse cookie e uma conta ativa (RF-01, D-01).
    - Ciclo da sessão (Q-22, P2):
      1. `POST /sessao` com credenciais corretas e conta ativa cria a sessão no servidor e devolve o cookie
         `matriz_sessao` (httpOnly, SameSite=Lax, Path=/; Secure exceto com `NODE_ENV=development`, P37). O cookie não tem
         Max-Age: a expiração é decidida no servidor. Na base de dados guarda-se só o hash do identificador.
      2. Cada pedido com o cookie relê a conta e os perfis e renova a expiração: a sessão expira após
         8 horas sem atividade (`SESSAO_HORAS`).
      3. A sessão deixa de ser aceite quando expira, quando a conta é desativada ou quando o utilizador
         a termina com `DELETE /sessao`. A partir daí, os pedidos recebem 401 `NAO_AUTENTICADO` e a
         resposta apaga o cookie.
    - A autorização é verificada em cada pedido, com o estado atual da conta, dos perfis e dos papéis (RV-09).
    - Todas as respostas levam `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY` e
      `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (P35).
    - A identidade do utilizador, o autor dos comentários e as datas são obtidos no backend,
      nunca aceites do cliente (Q-15, Q-22).
    - Estados e prioridades usam códigos técnicos (Q-21); a interface traduz para português (RNF-01).
    - As mensagens de erro estão em português (RNF-01).
    - As operações exclusivas do Administrador sobre projetos ficam em `/admin`, porque nelas o
      Administrador só vê o nome e o Gestor de cada projeto (A-02, Q-18, Q-19).

    Códigos de erro:
    - 400: pedido mal formado (JSON inválido, corpo acima de 100 kB, codificação desconhecida, campo desconhecido,
      tipo errado ou valor fora do enumerado) (P36).
    - 401: sem sessão válida ou com a conta desativada.
    - 403: o utilizador tem acesso ao recurso, mas o seu perfil ou papel não permite a ação.
    - 404: o recurso não existe ou o utilizador não é membro do projeto; não se revela se existe (D-10, EC-18).
    - 409: o estado atual do recurso impede a ação (projeto arquivado, projeto com tarefas,
      tarefa já iniciada, responsável já atribuído).
    - 422: os dados do pedido violam uma regra de negócio, com o campo e o motivo (Q-03).
      Por isso os textos obrigatórios e os limites de tamanho não são declarados no schema do pedido
      (um validador automático responderia 400): são verificados como regras de negócio.
    - 429: só em `POST /sessao`, com a entrada bloqueada por demasiadas tentativas falhadas (RV-35).
    - 500: erro inesperado no servidor, com o código `ERRO_INTERNO` e uma mensagem genérica, sem
      detalhes internos. Não é declarado em cada operação, porque pode acontecer em qualquer uma.

    Ordem de verificação (RV-25): 401, 404, 403, 409, 400, 422. As permissões são verificadas antes
    do conteúdo do pedido. Exemplo: um Membro que tenta criar uma tarefa num projeto arquivado
    recebe 403; o Gestor recebe 409.

    Pressupostos deste contrato (por aprovar):
    - Os caminhos e os nomes dos campos estão em português, alinhados com o modelo de dados.
    - Os identificadores são números inteiros.
    - As listas não são paginadas, por o piloto ser pequeno (RNF-06); ver docs/implementation-plan.md.

servers:
  - url: /api
    description: Caminho base relativo; em desenvolvimento, o Vite encaminha /api para o backend.

security:
  - sessao: []

tags:
  - name: Sessão
    description: Entrar, sair e consultar o utilizador autenticado (RF-01).
  - name: Contas
    description: Gestão de contas e perfis pelo Administrador (RF-02, RF-03).
  - name: Administração de projetos
    description: Criar, eliminar e transferir projetos, com a vista restrita do Administrador (RF-04, RF-30, RF-32).
  - name: Projetos
    description: Lista, pesquisa, painel, consulta, edição e arquivo de projetos (RF-05, RF-07, RF-08, RF-33, RF-35).
  - name: Membros
    description: Membros de um projeto (RF-06).
  - name: Tarefas
    description: Tarefas, estado e filtros (RF-09 a RF-15, RF-22, RF-34).
  - name: Responsáveis
    description: Responsáveis de uma tarefa (RF-10).
  - name: Comentários
    description: Comentários de uma tarefa (RF-24).
  - name: Progresso
    description: Indicadores de progresso de um projeto (RF-16 a RF-18).

paths:
  # ---------------------------------------------------------------- Saúde
  /saude:
    get:
      tags: [Sessão]
      operationId: obterSaude
      summary: Confirmar que o backend e a base de dados respondem
      description: Operação técnica, sem autenticação (Ficha 3, Exercício 2). Não devolve dados de negócio.
      security: []
      responses:
        '200':
          description: Backend e base de dados disponíveis.
          content:
            application/json:
              schema:
                type: object
                required: [estado, baseDeDados, migrations]
                properties:
                  estado:
                    type: string
                    enum: [ok]
                  baseDeDados:
                    type: string
                    enum: [ok]
                  migrations:
                    type: integer
                    description: Número de migrations aplicadas.
              example:
                estado: ok
                baseDeDados: ok
                migrations: 1

  # ---------------------------------------------------------------- Sessão
  /sessao:
    post:
      tags: [Sessão]
      operationId: entrar
      summary: Iniciar sessão
      description: |
        US-01, RF-01, Q-22. Em caso de sucesso, devolve o cookie `matriz_sessao` (httpOnly, SameSite=Lax).
        Credenciais erradas, email inexistente e conta desativada recebem a mesma resposta 401, para não revelar
        que a conta existe (CA-01.3, EC-20). O email não distingue maiúsculas. Ver o ciclo da sessão na descrição
        geral do contrato.

        Limite de tentativas (RV-35, EC-57, P29): 5 tentativas falhadas no mesmo email em 15 minutos bloqueiam
        a entrada nessa conta durante 15 minutos a contar da última falha; durante o bloqueio, a resposta é 429,
        mesmo com a palavra-passe certa. Uma entrada com sucesso repõe o contador. Os emails sem conta contam da
        mesma forma, para o bloqueio não revelar que a conta existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
            example:
              email: ana.silva@matriz.test
              palavraPasse: demo-1234
      responses:
        '200':
          description: Sessão iniciada.
          headers:
            Set-Cookie:
              description: Cookie de sessão `matriz_sessao`, httpOnly.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorAutenticado'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          description: Credenciais erradas ou conta desativada (CA-01.3, EC-20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: CREDENCIAIS_INVALIDAS
                mensagem: Email ou palavra-passe incorretos.
        '429':
          description: Entrada bloqueada depois de 5 tentativas falhadas em 15 minutos (RV-35, EC-57, P29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ENTRADA_BLOQUEADA
                mensagem: Demasiadas tentativas de entrada. Tente novamente dentro de 15 minutos.
    get:
      tags: [Sessão]
      operationId: obterSessao
      summary: Consultar o utilizador autenticado
      description: US-01, RF-01. Usado pela interface para saber quem está autenticado e que perfis tem.
      responses:
        '200':
          description: Utilizador autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorAutenticado'
              example:
                id: 2
                nome: Ana Silva
                email: ana.silva@matriz.test
                perfis: [GESTOR]
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    delete:
      tags: [Sessão]
      operationId: sair
      summary: Terminar sessão
      description: US-01, CA-01.4. Apaga a sessão no servidor e o cookie; os pedidos seguintes com o mesmo cookie recebem 401.
      responses:
        '204':
          description: Sessão terminada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  # ---------------------------------------------------------------- Contas
  /utilizadores:
    get:
      tags: [Contas]
      operationId: listarUtilizadores
      summary: Listar todas as contas (Administrador)
      description: |
        US-02 a US-04. Só o Administrador. Ativas primeiro, depois desativadas e no fim as anonimizadas
        (`removida`), cada grupo por ordem alfabética do nome (P26, RV-34).
      responses:
        '200':
          description: Contas, ativas e desativadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags: [Contas]
      operationId: criarUtilizador
      summary: Criar uma conta (Administrador)
      description: |
        US-02, RF-02. A conta fica ativa e, se não for Administrador, com o perfil Membro, que não se guarda (RV-02, RV-32).
        A palavra-passe inicial é guardada só como hash e nunca é devolvida (Q-22, EC-49). O nome e o email guardam-se
        sem espaços no início e no fim (P26); o email guarda-se em minúsculas, incluindo as letras acentuadas (RV-39).
        Os perfis Administrador e Gestor não se acumulam (RV-32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaConta'
            example:
              nome: João Pires
              email: joao.pires@matriz.test
              palavraPasse: inicial-5678
              perfis: []
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conta'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          description: |
            Códigos (P25, P31): `NOME_OBRIGATORIO`, `EMAIL_OBRIGATORIO`, `EMAIL_INVALIDO`, `EMAIL_RESERVADO` (domínio
            `.invalid`, reservado às contas anonimizadas, RV-40), `EMAIL_REPETIDO` (sem distinguir maiúsculas, EC-33,
            EC-38, RV-39), `PALAVRA_PASSE_CURTA` (menos de 8 caracteres, P3), `PALAVRA_PASSE_LONGA` (mais de 72 bytes,
            com `limite`, RV-38) e `PERFIS_INCOMPATIVEIS` (Administrador e Gestor, RV-32).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: EMAIL_REPETIDO
                mensagem: Já existe uma conta com este email.
                campo: email

  /utilizadores/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/UtilizadorId'
    patch:
      tags: [Contas]
      operationId: alterarUtilizador
      summary: Alterar perfis ou ativar e desativar uma conta (Administrador)
      description: |
        US-03, US-04, RF-02, RF-03. Desativar uma conta apaga as suas sessões (RV-09, EC-31) e regista a data da
        desativação; um ano depois, a conta é anonimizada automaticamente (RV-33, EC-56, P27, P28). Reativar antes
        disso cancela a anonimização (RV-34). Uma conta anonimizada não pode ser alterada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoConta'
            example:
              perfis: [GESTOR]
      responses:
        '200':
          description: Conta alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conta'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: |
            Códigos (P25): `GESTOR_PROPRIO` (Administrador a atribuir a si próprio o perfil Gestor, EC-36),
            `PERFIS_INCOMPATIVEIS` (Administrador e Gestor, RV-32), `GESTOR_COM_PROJETOS` (retirar o perfil Gestor ou
            desativar quem ainda gere projetos, EC-23, EC-26), `GESTOR_EM_VARIOS_PROJETOS` (retirar o perfil Gestor a
            quem é membro de mais de um projeto ativo, RV-36, EC-58), `ULTIMO_ADMINISTRADOR` (deixar de haver um Administrador
            ativo, EC-27), `ADMINISTRADOR_COM_PROJETOS` (perfil Administrador a quem é membro de projetos, EC-55) e
            `CONTA_REMOVIDA` (conta anonimizada, RV-34).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: GESTOR_COM_PROJETOS
                mensagem: Transfira primeiro todos os projetos deste Gestor.

  /utilizadores/gestores-elegiveis:
    get:
      tags: [Contas]
      operationId: listarGestoresElegiveis
      summary: Utilizadores que podem ser Gestor de um projeto (Administrador)
      description: |
        Para criar e transferir projetos: perfil Gestor, conta ativa e sem perfil Administrador
        (Q-18, D-22, RV-01, RV-13, EC-24, EC-42).
      responses:
        '200':
          description: Gestores elegíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizadorResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  # ---------------------------------------------------------------- Administração de projetos
  /admin/projetos:
    get:
      tags: [Administração de projetos]
      operationId: listarProjetosAdmin
      summary: Listar todos os projetos, só com nome e Gestor (Administrador)
      description: |
        US-05, US-10, US-21, RF-30, RF-33, A-02, CA-10.1. Não devolve tarefas, membros nem progresso.
        Ativos primeiro, depois arquivados; dentro de cada grupo, por ordem alfabética do nome (P12).
      parameters:
        - $ref: '#/components/parameters/PesquisaNome'
      responses:
        '200':
          description: Projetos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjetoAdmin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags: [Administração de projetos]
      operationId: criarProjeto
      summary: Criar um projeto e indicar o seu Gestor (Administrador)
      description: |
        US-05, RF-04, Q-18. O Gestor indicado passa a Gestor e membro do projeto, na mesma operação (A-01).
        O Administrador não passa a membro (CA-05.3). Outros perfis recebem 403 (EC-41).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoProjeto'
            example:
              nome: Lançamento do novo site
              gestorId: 2
      responses:
        '201':
          description: Projeto criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoAdmin'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          description: |
            Nome vazio ou só com espaços (EC-14, EC-02); texto acima do limite (EC-29);
            data de fim anterior à de início (EC-15); Gestor indicado inválido (EC-42).
            Códigos (P11): `NOME_OBRIGATORIO`, `LIMITE_EXCEDIDO`, `DATAS_INVALIDAS`, `GESTOR_INVALIDO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                nomeVazio:
                  summary: Nome vazio ou só com espaços
                  value:
                    codigo: NOME_OBRIGATORIO
                    mensagem: O nome do projeto é obrigatório.
                    campo: nome
                nomeLongo:
                  summary: Nome acima do limite
                  value:
                    codigo: LIMITE_EXCEDIDO
                    mensagem: O nome não pode ter mais de 100 caracteres.
                    campo: nome
                    limite: 100
                datas:
                  summary: Data de fim anterior à de início
                  value:
                    codigo: DATAS_INVALIDAS
                    mensagem: A data de fim não pode ser anterior à data de início.
                    campo: dataFim
                gestor:
                  summary: Gestor indicado inválido
                  value:
                    codigo: GESTOR_INVALIDO
                    mensagem: O Gestor tem de ter o perfil Gestor, conta ativa e não ser Administrador.
                    campo: gestorId

  /admin/projetos/{projetoId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    delete:
      tags: [Administração de projetos]
      operationId: eliminarProjeto
      summary: Eliminar um projeto sem tarefas (Administrador)
      description: |
        US-21, RF-32, Q-19. Definitivo; apaga também a lista de membros. A confirmação é pedida na interface (EC-10).
      responses:
        '204':
          description: Projeto eliminado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O projeto tem tarefas (EC-40).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: PROJETO_COM_TAREFAS
                mensagem: O projeto tem tarefas e não pode ser eliminado. O Gestor pode arquivá-lo.

  /admin/projetos/{projetoId}/gestor:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    put:
      tags: [Administração de projetos]
      operationId: transferirProjeto
      summary: Transferir um projeto para outro Gestor (Administrador)
      description: |
        US-10, RF-30, Q-04, Q-09. Permitido também em projetos arquivados (A-04). O novo Gestor passa a membro,
        se ainda não for (EC-37); o anterior continua membro (EC-25). Transferir para o Gestor atual não altera
        nada e devolve 200 (P14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gestorId]
              additionalProperties: false
              properties:
                gestorId:
                  type: integer
            example:
              gestorId: 3
      responses:
        '200':
          description: Projeto transferido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoAdmin'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: Destino sem perfil Gestor, desativado ou com perfil Administrador (EC-24, EC-35).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: GESTOR_INVALIDO
                mensagem: O Gestor tem de ter o perfil Gestor, conta ativa e não ser Administrador.
                campo: gestorId

  /admin/projetos/{projetoId}/membros:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Administração de projetos]
      operationId: listarMembrosAdmin
      summary: Membros de um projeto, com nome e email (Administrador)
      description: |
        US-07, RF-06, RV-32, EC-54, P24. Qualquer projeto, ativo ou arquivado. Por ordem alfabética do nome (P16).
        Não dá acesso às tarefas, aos comentários nem ao progresso (D-05).
      responses:
        '200':
          description: Membros do projeto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembroAdmin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Administração de projetos]
      operationId: adicionarMembroAdmin
      summary: Adicionar um membro a um projeto (Administrador)
      description: |
        US-07, RF-06, RV-32, EC-54, P24. Mesmas regras que `adicionarMembro`: só contas ativas (Q-11), nunca um
        Administrador (EC-30), um só projeto ativo para quem não tem o perfil Gestor (RV-31, EC-52) e não num projeto
        arquivado (D-09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizadorId]
              additionalProperties: false
              properties:
                utilizadorId:
                  type: integer
      responses:
        '201':
          description: Membro adicionado. Devolve a lista atualizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembroAdmin'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          description: |
            Utilizador inexistente, desativado, já membro (EC-39), Administrador (EC-30) ou, sem o perfil Gestor, já membro
            de outro projeto ativo (EC-52). Códigos (P15, P22, P23): `MEMBRO_INVALIDO`, `MEMBRO_REPETIDO`,
            `MEMBRO_ADMINISTRADOR` e `MEMBRO_NOUTRO_PROJETO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: MEMBRO_ADMINISTRADOR
                mensagem: Um Administrador não pode ser membro de um projeto.
                campo: utilizadorId

  /admin/projetos/{projetoId}/membros/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/UtilizadorId'
    delete:
      tags: [Administração de projetos]
      operationId: removerMembroAdmin
      summary: Remover um membro de um projeto (Administrador)
      description: |
        US-07, RF-06, RV-32, EC-54, P24. Mesmas regras que `removerMembro`: remove também as atribuições nas tarefas
        do projeto (EC-19); possível num projeto arquivado (RV-31); o Gestor não pode ser removido, substitui-se por
        transferência (Q-05, EC-28). Remover quem não é membro responde 404.
      responses:
        '204':
          description: Membro removido.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Tentativa de remover o Gestor do projeto (EC-28).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: GESTOR_NAO_REMOVIVEL
                mensagem: O Gestor não pode ser removido. Transfira o projeto para outro Gestor.

  /admin/projetos/{projetoId}/candidatos-membros:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Administração de projetos]
      operationId: listarCandidatosMembrosAdmin
      summary: Utilizadores que podem ser adicionados a um projeto (Administrador)
      description: |
        US-07, RF-06, RV-32, EC-54, P24. A mesma lista que `listarCandidatosMembros`: contas ativas, sem
        Administradores e, de quem não tem o perfil Gestor, só quem não está em nenhum projeto ativo.
      responses:
        '200':
          description: Candidatos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizadorResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ---------------------------------------------------------------- Projetos
  /projetos:
    get:
      tags: [Projetos]
      operationId: listarProjetos
      summary: Projetos do utilizador, com contagens por estado (lista e painel inicial)
      description: |
        US-09, US-22, US-25, RF-08, RF-33, RF-35. Só os projetos de que o utilizador é membro (D-10);
        ativos primeiro, depois arquivados (A-06); dentro de cada grupo, por ordem alfabética do nome (P12). Inclui as contagens por estado para o painel (RF-16).
      parameters:
        - $ref: '#/components/parameters/PesquisaNome'
      responses:
        '200':
          description: Projetos do utilizador. Lista vazia quando não há resultados (EC-47, CA-25.3).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjetoResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /projetos/{projetoId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Projetos]
      operationId: obterProjeto
      summary: Consultar um projeto
      description: US-06, US-09. Só membros do projeto (EC-18).
      responses:
        '200':
          description: Projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [Projetos]
      operationId: editarProjeto
      summary: Editar os dados de um projeto (Gestor do projeto)
      description: |
        US-06, RF-05. Aplicam-se as regras de RF-04 para o nome, a descrição e as datas, com os mesmos códigos
        de erro da criação (`NOME_OBRIGATORIO`, `LIMITE_EXCEDIDO`, `DATAS_INVALIDAS`; P11). Só se alteram os campos
        enviados; as datas são comparadas também com os valores já guardados. O nome guarda-se sem espaços
        nas pontas (P13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoProjeto'
      responses:
        '200':
          description: Projeto alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

  /projetos/{projetoId}/arquivado:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    put:
      tags: [Projetos]
      operationId: arquivarProjeto
      summary: Arquivar ou desarquivar um projeto (Gestor do projeto)
      description: |
        US-08, RF-07, A-05, A-13. Idempotente.
        Desarquivar é recusado (409 `MEMBRO_NOUTRO_PROJETO`, P22) se algum membro sem o perfil Gestor estiver noutro
        projeto ativo; a mensagem indica quem (RV-31, EC-53). O Gestor pode remover esse membro do projeto arquivado e voltar a tentar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arquivado]
              additionalProperties: false
              properties:
                arquivado:
                  type: boolean
            example:
              arquivado: true
      responses:
        '200':
          description: Estado de arquivo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Ao desarquivar, um membro sem o perfil Gestor já está noutro projeto ativo (RV-31, EC-53, P22).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: MEMBRO_NOUTRO_PROJETO
                mensagem: 'Não é possível desarquivar: Marta Lopes já é membro de outro projeto ativo.'

  # ---------------------------------------------------------------- Membros
  /projetos/{projetoId}/membros:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Membros]
      operationId: listarMembros
      summary: Membros do projeto (só o nome)
      description: |
        US-07, RF-06, Q-13, CA-07.3. Qualquer membro. Sem email. Por ordem alfabética do nome (P16). Também serve para escolher responsáveis:
        a interface mostra só os membros com conta ativa que ainda não são responsáveis (CA-12.4).
      responses:
        '200':
          description: Membros do projeto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponsavelResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Membros]
      operationId: adicionarMembro
      summary: Adicionar um membro (Gestor do projeto)
      description: |
        US-07, RF-06. Só utilizadores com conta ativa (Q-11, EC-39). Um Administrador nunca é membro (RV-32, EC-30).
        Quem não tem o perfil Gestor só pode ser membro de um projeto ativo de cada vez; os projetos arquivados não contam (RV-31, EC-52).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizadorId]
              additionalProperties: false
              properties:
                utilizadorId:
                  type: integer
      responses:
        '201':
          description: Membro adicionado. Devolve a lista atualizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponsavelResumo'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          description: |
            Utilizador inexistente, desativado, já membro (EC-39), Administrador (EC-30) ou, sem o perfil Gestor, já membro
            de outro projeto ativo (EC-52). Códigos (P15, P22, P23): `MEMBRO_INVALIDO` (inexistente ou desativado),
            `MEMBRO_REPETIDO` (já é membro), `MEMBRO_ADMINISTRADOR` (tem o perfil Administrador) e
            `MEMBRO_NOUTRO_PROJETO` (já é membro de outro projeto ativo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                invalido:
                  summary: Utilizador inexistente ou desativado
                  value:
                    codigo: MEMBRO_INVALIDO
                    mensagem: Só se podem adicionar utilizadores com conta ativa.
                    campo: utilizadorId
                repetido:
                  summary: Utilizador que já é membro
                  value:
                    codigo: MEMBRO_REPETIDO
                    mensagem: O utilizador já é membro do projeto.
                    campo: utilizadorId
                administrador:
                  summary: Utilizador com o perfil Administrador
                  value:
                    codigo: MEMBRO_ADMINISTRADOR
                    mensagem: Um Administrador não pode ser membro de um projeto.
                    campo: utilizadorId
                noutroProjeto:
                  summary: Utilizador sem o perfil Gestor que já é membro de outro projeto ativo
                  value:
                    codigo: MEMBRO_NOUTRO_PROJETO
                    mensagem: O utilizador já é membro de outro projeto ativo. O Gestor desse projeto tem de o remover primeiro.
                    campo: utilizadorId

  /projetos/{projetoId}/membros/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/UtilizadorId'
    delete:
      tags: [Membros]
      operationId: removerMembro
      summary: Remover um membro (Gestor do projeto)
      description: |
        US-07, RF-06. Remove também as suas atribuições nas tarefas do projeto (A-14, Q-20, EC-19). Remover quem não é membro responde 404.
        Também é possível num projeto arquivado (exceção a D-09, RV-31).
      responses:
        '204':
          description: Membro removido.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Tentativa de remover o Gestor do projeto (EC-28).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: GESTOR_NAO_REMOVIVEL
                mensagem: O Gestor não pode ser removido. Peça ao Administrador para transferir o projeto.

  /projetos/{projetoId}/candidatos-membros:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Membros]
      operationId: listarCandidatosMembros
      summary: Utilizadores que podem ser adicionados como membros (Gestor do projeto)
      description: |
        US-07, RF-06, A-21, CA-07.1. Utilizadores com conta ativa que ainda não são membros, com nome e email,
        por ordem alfabética do nome (P16). Não inclui Administradores (RV-32, EC-30). Quem não tem o perfil Gestor só
        aparece se não for membro de nenhum projeto ativo (RV-31, EC-52).
      responses:
        '200':
          description: Candidatos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizadorResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ---------------------------------------------------------------- Tarefas
  /projetos/{projetoId}/tarefas:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Tarefas]
      operationId: listarTarefas
      summary: Listar as tarefas de um projeto, com filtros
      description: |
        US-17, US-23, RF-15, RF-34. Qualquer membro. Ordem de Q-12: por estado (TODO, IN_PROGRESS, DONE)
        e, dentro de cada estado, por data limite crescente, sem data no fim; empates por ordem alfabética do
        título (P18). Os filtros combinam-se (CA-23.2). Um valor de filtro inexistente ou um parâmetro desconhecido
        responde 400 (EC-48).
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Estado'
        - name: prioridade
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Prioridade'
      responses:
        '200':
          description: Tarefas. Lista vazia quando nenhuma cumpre os filtros (EC-48).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Tarefas]
      operationId: criarTarefa
      summary: Criar uma tarefa num projeto (Gestor do projeto)
      description: |
        US-11, RF-09, RF-10, RF-12.

        - Só o Gestor do projeto cria tarefas (D-11, EC-05).
        - O estado inicial é sempre TODO e não pode ser indicado no pedido (D-13, CA-11.4).
        - A prioridade é MEDIUM por omissão (A-19, CA-11.3).
        - Os responsáveis, se indicados, têm de ser membros do projeto com conta ativa, sem repetir (D-12, A-15, Q-20).
        - A data limite pode estar no passado; a tarefa fica logo em atraso (A-07, EC-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaTarefa'
            examples:
              soTitulo:
                summary: Só com o título (CA-11.1)
                value:
                  titulo: Preparar reunião de arranque
              completa:
                summary: Todos os campos (CA-11.2)
                value:
                  titulo: Rever orçamento
                  descricao: Confirmar os valores com a equipa financeira.
                  responsavelIds: [2, 4]
                  prioridade: HIGH
                  dataLimite: '2026-11-15'
      responses:
        '201':
          description: Tarefa criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
              example:
                id: 501
                projetoId: 12
                titulo: Preparar reunião de arranque
                descricao: null
                responsaveis: []
                prioridade: MEDIUM
                dataLimite: null
                estado: TODO
                emAtraso: false
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          description: |
            Título vazio ou só com espaços (EC-01, EC-02); texto acima do limite (EC-29);
            responsável que não é membro ativo do projeto ou repetido (EC-03, EC-22, EC-43).
            Responsáveis (P17): `RESPONSAVEL_REPETIDO` (identificador repetido) e `RESPONSAVEL_INVALIDO`
            (não é membro do projeto com conta ativa), ambos com `campo: responsavelIds`; ambos são 422,
            apesar de `uniqueItems` no schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                responsavelRepetido:
                  summary: Responsável indicado mais de uma vez
                  value:
                    codigo: RESPONSAVEL_REPETIDO
                    mensagem: O mesmo responsável foi indicado mais de uma vez.
                    campo: responsavelIds
                responsavelInvalido:
                  summary: Responsável que não é membro ativo do projeto
                  value:
                    codigo: RESPONSAVEL_INVALIDO
                    mensagem: O responsável tem de ser membro do projeto com conta ativa.
                    campo: responsavelIds
                tituloVazio:
                  summary: Título vazio ou só com espaços
                  value:
                    codigo: TITULO_OBRIGATORIO
                    mensagem: O título é obrigatório.
                    campo: titulo
                tituloLongo:
                  summary: Título acima do limite
                  value:
                    codigo: LIMITE_EXCEDIDO
                    mensagem: O título não pode ter mais de 200 caracteres.
                    campo: titulo
                    limite: 200

  /projetos/{projetoId}/tarefas/{tarefaId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/TarefaId'
    get:
      tags: [Tarefas]
      operationId: obterTarefa
      summary: Consultar uma tarefa
      description: US-17, RF-15, CA-17.2. Qualquer membro lê a descrição de qualquer tarefa (RV-17).
      responses:
        '200':
          description: Tarefa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [Tarefas]
      operationId: editarTarefa
      summary: Editar uma tarefa
      description: |
        US-14, US-15, RF-13, RF-14. O Gestor do projeto edita todos os campos. Um responsável que não é
        Gestor só pode enviar `descricao` (CA-14.2); qualquer outro campo responde 403.
        O estado muda-se em `/estado` e os responsáveis em `/responsaveis`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoTarefa'
      responses:
        '200':
          description: Tarefa alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
    delete:
      tags: [Tarefas]
      operationId: eliminarTarefa
      summary: Eliminar uma tarefa em TODO (Gestor do projeto)
      description: |
        US-16, RF-22. Definitivo; apaga também as atribuições e os comentários (EC-09).
        A confirmação é pedida na interface (EC-10).
      responses:
        '204':
          description: Tarefa eliminada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Projeto arquivado (EC-16) ou tarefa já iniciada (EC-13).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: TAREFA_INICIADA
                mensagem: Só se podem eliminar tarefas por fazer.

  /projetos/{projetoId}/tarefas/{tarefaId}/estado:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/TarefaId'
    put:
      tags: [Tarefas]
      operationId: mudarEstadoTarefa
      summary: Mudar o estado de uma tarefa
      description: |
        US-13, US-14, RF-11, RF-12, RF-13.

        - Mudam o estado os responsáveis da tarefa e o Gestor do projeto (R-11, Q-20, CA-13.1, CA-13.2).
        - Qualquer outro membro recebe 403, incluindo numa tarefa sem responsáveis (CA-13.3, EC-04).
        - Qualquer transição é permitida, incluindo reabrir uma tarefa concluída (D-13, CA-13.4, EC-08).
        - A operação é idempotente: indicar o estado atual devolve 200 sem alterações.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              additionalProperties: false
              properties:
                estado:
                  $ref: '#/components/schemas/Estado'
            example:
              estado: IN_PROGRESS
      responses:
        '200':
          description: Estado atualizado. Devolve a tarefa com o novo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'

  # ---------------------------------------------------------------- Responsáveis
  /projetos/{projetoId}/tarefas/{tarefaId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/TarefaId'
    post:
      tags: [Responsáveis]
      operationId: adicionarResponsavel
      summary: Adicionar um responsável, ou juntar-se a uma tarefa
      description: |
        US-12, US-20, RF-10, Q-20.

        - O Gestor do projeto adiciona qualquer membro com conta ativa (CA-12.1, CA-12.2).
        - Outro membro só se pode adicionar a si próprio, e só numa tarefa sem responsáveis (CA-20.1, EC-34).
          Indicar outro utilizador responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizadorId]
              additionalProperties: false
              properties:
                utilizadorId:
                  type: integer
            example:
              utilizadorId: 4
      responses:
        '201':
          description: Responsável adicionado. Devolve a tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: |
            Projeto arquivado (EC-16); utilizador já é responsável (EC-43);
            membro a juntar-se a uma tarefa que já tem responsáveis (EC-34, código `TAREFA_COM_RESPONSAVEIS`, P20).
            O 409 de projeto arquivado é verificado antes do formato do pedido; os outros dois, que dependem do
            conteúdo do pedido, depois (P20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: RESPONSAVEL_REPETIDO
                mensagem: Este utilizador já é responsável pela tarefa.
        '422':
          description: Utilizador inexistente, que não é membro do projeto ou com conta desativada (EC-03, EC-22).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: RESPONSAVEL_INVALIDO
                mensagem: O responsável tem de ser membro do projeto com conta ativa.
                campo: utilizadorId

  /projetos/{projetoId}/tarefas/{tarefaId}/responsaveis/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/TarefaId'
      - $ref: '#/components/parameters/UtilizadorId'
    delete:
      tags: [Responsáveis]
      operationId: removerResponsavel
      summary: Remover um responsável, ou sair de uma tarefa
      description: |
        US-12, US-20, RF-10. O Gestor do projeto remove qualquer responsável (CA-12.3);
        outro membro só se pode remover a si próprio (CA-20.2).
      responses:
        '200':
          description: Responsável removido. Devolve a tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Projeto, tarefa ou atribuição inexistentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'

  # ---------------------------------------------------------------- Comentários
  /projetos/{projetoId}/tarefas/{tarefaId}/comentarios:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/TarefaId'
    get:
      tags: [Comentários]
      operationId: listarComentarios
      summary: Listar os comentários de uma tarefa
      description: US-24, RF-24, CA-24.2. Qualquer membro; o mais antigo primeiro. Também em projetos arquivados.
      responses:
        '200':
          description: Comentários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comentario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Comentários]
      operationId: adicionarComentario
      summary: Adicionar um comentário
      description: |
        US-24, RF-24, Q-15. Qualquer membro do projeto. O autor e a data são obtidos no backend;
        um pedido com outros campos responde 400 (EC-45).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              additionalProperties: false
              properties:
                conteudo:
                  type: string
                  description: Obrigatório; só espaços conta como vazio (EC-44). Limite em RNF-03 (EC-29).
            example:
              conteudo: Já falei com o fornecedor; envia a proposta até sexta.
      responses:
        '201':
          description: Comentário adicionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comentario'
              example:
                id: 77
                autor:
                  id: 4
                  nome: Marta Lopes
                  contaAtiva: true
                conteudo: Já falei com o fornecedor; envia a proposta até sexta.
                criadoEm: '2026-10-29T15:42:10Z'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          description: |
            Conteúdo vazio ou só com espaços (`CONTEUDO_OBRIGATORIO`, EC-44); acima de 2000 caracteres
            (`LIMITE_EXCEDIDO`, com `campo: conteudo` e `limite: 2000`; EC-29, P4, P21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: CONTEUDO_OBRIGATORIO
                mensagem: O comentário não pode estar vazio.
                campo: conteudo

  # ---------------------------------------------------------------- Progresso
  /projetos/{projetoId}/progresso:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Progresso]
      operationId: obterProgressoProjeto
      summary: Consultar o progresso de um projeto
      description: |
        US-18, US-19, RF-16, RF-17, RF-18.

        - Qualquer membro do projeto pode consultar, também num projeto arquivado (D-09).
        - Quem não é membro recebe 404 (CA-18.4, EC-18); inclui o Administrador, que nunca é membro (D-05, RV-32).
        - Os valores são calculados no momento do pedido, sobre todas as tarefas, sem filtros (RF-34).
        - O dia de hoje é determinado no fuso Europe/Lisbon (RNF-02, A-08).
      responses:
        '200':
          description: Progresso do projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progresso'
              examples:
                comTarefas:
                  summary: 10 tarefas, 3 concluídas, 1 em atraso (CA-18.1)
                  value:
                    projetoId: 12
                    dataReferencia: '2026-10-29'
                    total: 10
                    contagemPorEstado:
                      TODO: 5
                      IN_PROGRESS: 2
                      DONE: 3
                    percentagemConcluida: 30.0
                    tarefasEmAtraso:
                      quantidade: 1
                      tarefas:
                        - id: 480
                          titulo: Enviar proposta ao fornecedor
                          responsaveis:
                            - id: 7
                              nome: Rui Costa
                              contaAtiva: false
                          dataLimite: '2026-10-20'
                          estado: IN_PROGRESS
                semTarefas:
                  summary: Projeto sem tarefas (CA-18.5)
                  value:
                    projetoId: 13
                    dataReferencia: '2026-10-29'
                    total: 0
                    contagemPorEstado:
                      TODO: 0
                      IN_PROGRESS: 0
                      DONE: 0
                    percentagemConcluida: null
                    tarefasEmAtraso:
                      quantidade: 0
                      tarefas: []
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: matriz_sessao
      description: Cookie httpOnly devolvido por `POST /sessao` (Q-22).

  parameters:
    ProjetoId:
      name: projetoId
      in: path
      required: true
      schema:
        type: integer
    TarefaId:
      name: tarefaId
      in: path
      required: true
      schema:
        type: integer
    UtilizadorId:
      name: utilizadorId
      in: path
      required: true
      schema:
        type: integer
    PesquisaNome:
      name: nome
      in: query
      required: false
      description: Texto contido no nome do projeto, sem distinguir maiúsculas de minúsculas (RF-33).
      schema:
        type: string

  schemas:
    Prioridade:
      type: string
      enum: [HIGH, MEDIUM, LOW]
      description: Alta, Média, Baixa (D-19, Q-21).

    Estado:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: Por fazer, Em curso, Concluída (R-11, Q-21).

    Perfil:
      type: string
      enum: [ADMIN, GESTOR]
      description: Perfis guardados; o perfil Membro é comum a todos e não aparece (RV-02).

    Data:
      type: string
      format: date
      description: Data sem hora (AAAA-MM-DD).

    Credenciais:
      type: object
      required: [email, palavraPasse]
      additionalProperties: false
      properties:
        email:
          type: string
        palavraPasse:
          type: string

    UtilizadorAutenticado:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/Perfil'

    Conta:
      type: object
      description: Conta vista pelo Administrador. Nunca inclui a palavra-passe nem o seu hash (EC-49).
      required: [id, nome, email, perfis, ativo, removida]
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
        removida:
          type: boolean
          description: Conta anonimizada um ano depois da desativação; aparece como "Conta removida" e não se altera (RV-33, RV-34, P28).

    NovaConta:
      type: object
      required: [nome, email, palavraPasse, perfis]
      additionalProperties: false
      properties:
        nome:
          type: string
        email:
          type: string
        palavraPasse:
          type: string
          description: Palavra-passe inicial (Q-22); pelo menos 8 caracteres (P3) e no máximo 72 bytes em UTF-8 (RV-38).
        perfis:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Perfil'

    AlteracaoConta:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        perfis:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean

    UtilizadorResumo:
      type: object
      description: Nome e email, para escolher membros (A-21) ou Gestores.
      required: [id, nome, email]
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string

    MembroAdmin:
      type: object
      description: Membro de um projeto visto pelo Administrador, com email (RV-32, P24).
      required: [id, nome, email, contaAtiva]
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        contaAtiva:
          type: boolean

    ResponsavelResumo:
      type: object
      description: |
        Utilizador visto dentro de um projeto, sem email (Q-13). Com `contaAtiva` falso,
        a interface mostra o aviso "conta desativada" (A-15, EC-21).
      required: [id, nome, contaAtiva]
      properties:
        id:
          type: integer
        nome:
          type: string
        contaAtiva:
          type: boolean

    GestorResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
        nome:
          type: string

    ContagemPorEstado:
      type: object
      description: Número de tarefas em cada estado (RF-16).
      required: [TODO, IN_PROGRESS, DONE]
      properties:
        TODO:
          type: integer
          minimum: 0
        IN_PROGRESS:
          type: integer
          minimum: 0
        DONE:
          type: integer
          minimum: 0

    ProjetoAdmin:
      type: object
      description: Vista restrita do Administrador (A-02).
      required: [id, nome, arquivado, gestor]
      properties:
        id:
          type: integer
        nome:
          type: string
        arquivado:
          type: boolean
        gestor:
          $ref: '#/components/schemas/GestorResumo'

    ProjetoResumo:
      type: object
      description: Projeto na lista e no painel inicial (RF-08, RF-35).
      required: [id, nome, arquivado, gestor, contagemPorEstado]
      properties:
        id:
          type: integer
        nome:
          type: string
        arquivado:
          type: boolean
        gestor:
          $ref: '#/components/schemas/GestorResumo'
        contagemPorEstado:
          $ref: '#/components/schemas/ContagemPorEstado'

    Projeto:
      type: object
      required: [id, nome, descricao, dataInicio, dataFim, arquivado, gestor, souGestor]
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: [string, 'null']
        dataInicio:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        dataFim:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        arquivado:
          type: boolean
        gestor:
          $ref: '#/components/schemas/GestorResumo'
        souGestor:
          type: boolean
          description: Verdadeiro se o utilizador autenticado é o Gestor do projeto; a interface usa-o para mostrar as ações.

    NovoProjeto:
      type: object
      required: [nome, gestorId]
      additionalProperties: false
      properties:
        nome:
          type: string
          description: Obrigatório; até 100 caracteres (D-06, A-20).
        descricao:
          type: [string, 'null']
          description: Até 5000 caracteres (A-20).
        dataInicio:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        dataFim:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        gestorId:
          type: integer
          description: Perfil Gestor, conta ativa, sem perfil Administrador (Q-18).

    AlteracaoProjeto:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome:
          type: string
        descricao:
          type: [string, 'null']
        dataInicio:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        dataFim:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'

    NovaTarefa:
      type: object
      description: Dados para criar uma tarefa (RF-09). O estado não é aceite (CA-11.4).
      required: [titulo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          description: Obrigatório; até 200 caracteres (Q-01, A-20).
        descricao:
          type: [string, 'null']
          description: Opcional; até 5000 caracteres (A-20).
        responsavelIds:
          type: array
          uniqueItems: true
          items:
            type: integer
          description: Opcional. Membros do projeto com conta ativa (D-12, A-15, Q-20).
        prioridade:
          $ref: '#/components/schemas/Prioridade'
          default: MEDIUM
        dataLimite:
          description: Opcional; pode estar no passado (A-07).
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'

    AlteracaoTarefa:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo:
          type: string
        descricao:
          type: [string, 'null']
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        dataLimite:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'

    Tarefa:
      type: object
      required: [id, projetoId, titulo, descricao, responsaveis, prioridade, dataLimite, estado, emAtraso]
      properties:
        id:
          type: integer
        projetoId:
          type: integer
        titulo:
          type: string
        descricao:
          type: [string, 'null']
        responsaveis:
          type: array
          description: Zero, um ou vários responsáveis (Q-20).
          items:
            $ref: '#/components/schemas/ResponsavelResumo'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        dataLimite:
          oneOf:
            - $ref: '#/components/schemas/Data'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/Estado'
        emAtraso:
          type: boolean
          description: |
            Calculado, não guardado. Verdadeiro quando a data limite é anterior ao dia de hoje
            (Europe/Lisbon) e o estado não é DONE (D-18, A-08).

    TarefaEmAtraso:
      type: object
      required: [id, titulo, responsaveis, dataLimite, estado]
      properties:
        id:
          type: integer
        titulo:
          type: string
        responsaveis:
          type: array
          items:
            $ref: '#/components/schemas/ResponsavelResumo'
        dataLimite:
          $ref: '#/components/schemas/Data'
        estado:
          type: string
          enum: [TODO, IN_PROGRESS]

    Progresso:
      type: object
      required: [projetoId, dataReferencia, total, contagemPorEstado, percentagemConcluida, tarefasEmAtraso]
      properties:
        projetoId:
          type: integer
        dataReferencia:
          $ref: '#/components/schemas/Data'
          description: Dia de hoje em Europe/Lisbon, usado para calcular os atrasos (RNF-02).
        total:
          type: integer
          minimum: 0
        contagemPorEstado:
          $ref: '#/components/schemas/ContagemPorEstado'
        percentagemConcluida:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: |
            Tarefas concluídas sobre o total, arredondada às décimas (RF-17, A-09).
            100 só quando todas as tarefas estão concluídas; caso contrário, no máximo 99.9 (RV-12, CA-18.6).
            Vazio quando o projeto não tem tarefas; a interface mostra "Sem tarefas" (A-09, CA-18.5).
        tarefasEmAtraso:
          type: object
          description: Quantas e quais tarefas estão em atraso (RF-18).
          required: [quantidade, tarefas]
          properties:
            quantidade:
              type: integer
              minimum: 0
            tarefas:
              type: array
              description: Ordenadas por data limite crescente, a mais antiga primeiro (Q-12, CA-19.5).
              items:
                $ref: '#/components/schemas/TarefaEmAtraso'

    Comentario:
      type: object
      required: [id, autor, conteudo, criadoEm]
      properties:
        id:
          type: integer
        autor:
          $ref: '#/components/schemas/ResponsavelResumo'
        conteudo:
          type: string
        criadoEm:
          type: string
          format: date-time
          description: Data e hora do servidor, em UTC; a interface mostra-a em Europe/Lisbon (RNF-02).

    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          description: Código estável do erro, para o cliente web.
        mensagem:
          type: string
          description: Mensagem em português para mostrar ao utilizador (RNF-01).
        campo:
          type: string
          description: Campo do pedido que causou o erro, quando se aplica.
        limite:
          type: integer
          description: Limite de caracteres excedido, quando se aplica (Q-03).

  responses:
    PedidoInvalido:
      description: Pedido mal formado (JSON inválido, campo desconhecido, tipo errado ou valor fora do enumerado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: PEDIDO_INVALIDO
            mensagem: O pedido tem um formato inválido.
    NaoAutenticado:
      description: Sem sessão válida ou com a conta desativada (RF-01, RV-09, EC-20, EC-31, CA-01.5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_AUTENTICADO
            mensagem: A sessão terminou. Entre novamente.
    SemPermissao:
      description: O utilizador tem acesso ao recurso, mas o seu perfil ou papel não permite esta ação (secção 3 de requirements.md).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: SEM_PERMISSAO
            mensagem: Não tem permissão para esta ação.
    NaoEncontrado:
      description: O recurso não existe ou o utilizador não é membro do projeto (D-10, EC-18, CA-18.4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_ENCONTRADO
            mensagem: Não encontrado.
    ProjetoArquivado:
      description: O projeto está arquivado e só permite consulta (D-09, EC-16).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: PROJETO_ARQUIVADO
            mensagem: O projeto está arquivado e só pode ser consultado.
    RegraNegocio:
      description: Os dados violam uma regra de negócio (Q-03); ver `codigo`, `campo` e `limite`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
