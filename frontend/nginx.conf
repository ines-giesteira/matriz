# Serve a interface da Matriz e encaminha /api para o backend, na mesma origem
# (docs/architecture.md, secção 6).
# É um template da imagem oficial do nginx: ao arrancar, ${PORT} e ${BACKEND_ENDERECO} são substituídos
# pelas variáveis de ambiente do container. Os valores por omissão estão no frontend/Dockerfile
# (porta 80 e backend:3000, o nome do serviço na rede do Docker Compose); no Render vêm do render.yaml.
server {
    listen ${PORT};
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://${BACKEND_ENDERECO};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas da SPA (React Router): qualquer caminho que não seja um ficheiro devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
