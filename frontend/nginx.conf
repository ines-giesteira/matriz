# Serve a interface da Matriz e encaminha /api para o backend, na mesma origem
# (docs/architecture.md, secção 6). O backend tem de estar acessível com o nome "backend" na mesma rede Docker.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas da SPA (React Router): qualquer caminho que não seja um ficheiro devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
